name: CI

on:
  push:
    branches: [main, upgrade-ui-system]
  pull_request:

jobs:
  backend:
    name: Backend (Django, Postgres)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zentro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite (Postgres)
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/zentro_test
          DB_SSLMODE: disable
          DEBUG: "False"
        run: python manage.py test --verbosity 1

  frontend:
    name: Frontend (typecheck + build + lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: zentro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zentro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Django
      SECRET_KEY: "docker-secret-key-change-in-production"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      # PostgreSQL
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/zentro"
      # Redis
      REDIS_URL: "redis://redis:6379/0"
      # CORS
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      # Frontend URL
      FRONTEND_URL: "http://localhost:3000"
    volumes:
      - backend_media:/app/media

  # ── React Frontend (TanStack Start) ────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_DJANGO_API_BASE_URL: "http://localhost:8000/api"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      PORT: "3000"
      NODE_ENV: "production"
      DJANGO_API_BASE_URL: "http://localhost:8000/api"

volumes:
  postgres_data:
  backend_media:
